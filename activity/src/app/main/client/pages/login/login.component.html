<div class="login-container">
    <mat-card class="login-card">
      <mat-card-title>Login To Your Account</mat-card-title>
      <p *ngIf="errMsg" class="errMsg">{{errMsg}}</p>
      <mat-card-content>
        <form [formGroup]="login" (ngSubmit)="onLogin()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="username" type="email" required />
            <mat-error *ngIf="username?.hasError('required')">
              Username is required
            </mat-error>
            <mat-error *ngIf="username?.hasError('email')">
              Please enter a valid email
            </mat-error>
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" required />
            <mat-error *ngIf="password?.hasError('required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="password?.hasError('minlength')">
              Passwod must be at least 8 characters
            </mat-error>
          </mat-form-field>
  
          <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="login.invalid">
            Login
          </button>
        </form>
        <div class="signup-link">
            Don't have an account? <a routerLink="">Sign Up</a>
          </div>
      </mat-card-content>
    </mat-card>
  </div>
